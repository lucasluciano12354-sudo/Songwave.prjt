<!DOCTYPE html>
<html lang="pt-br">

<head>
       <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SongWave • Login</title>

<link rel="stylesheet" href="css/login.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="login-card">

<div class="logo">

<i class="fa-solid fa-music"></i>

</div>

<h1>Bem-vindo</h1>

<p>Entre para continuar ouvindo.</p>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="nome"
placeholder="Usuário">

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="senha"
placeholder="Senha">

</div>

<button onclick="login()">

Entrar

</button>

<div class="linha">

<span>ou</span>

</div>

<button
class="cadastro"
onclick="cadastro()">

Criar Conta

</button>

</div>

<section class="logo-lgn">
    <img src="../img/logo.png" alt="SongWave">
    <h1>SongWave</h1>
    <p>You make your own wave.</p>
</section>

<script src="login.js"></script>

</body>
</html>
